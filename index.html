<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070611" />
    <meta name="description" content="一场藏在星空里的、逐句展开的捉迷藏。" />
    <title>找到我的人</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <canvas id="stars" aria-hidden="true"></canvas>
    <div class="nebula nebula-a" aria-hidden="true"></div>
    <div class="nebula nebula-b" aria-hidden="true"></div>

    <header class="topbar">
      <button id="soundToggle" class="icon-button" type="button" aria-label="关闭音乐" aria-pressed="false">
        <span class="sound-bars" aria-hidden="true"><i></i><i></i><i></i></span>
      </button>
      <button id="reviewButton" class="review-button" type="button">回顾对话</button>
    </header>

    <main id="stage" class="stage" tabindex="0" role="button" aria-label="点击显示下一句话">
      <section id="story" class="story" aria-live="polite" aria-atomic="true">
        <p id="previousLine" class="previous-line" aria-hidden="true"></p>
        <div class="line-wrap">
          <span class="quote-mark" aria-hidden="true">✦</span>
          <p id="storyLine" class="story-line"></p>
        </div>
        <p id="continueHint" class="continue-hint">点击屏幕</p>
      </section>
    </main>

    <footer class="progress-area" aria-hidden="true">
      <div class="progress-track"><span id="progressFill"></span></div>
      <span id="progressLabel">00 / 00</span>
    </footer>

    <div id="reviewBackdrop" class="review-backdrop" hidden></div>
    <aside id="reviewPanel" class="review-panel" aria-hidden="true" aria-label="对话回顾">
      <header class="review-header">
        <div><small>MEMORIES</small><h2>回顾对话</h2></div>
        <button id="closeReview" type="button" aria-label="关闭对话回顾">×</button>
      </header>
      <div id="reviewList" class="review-list"></div>
    </aside>

    <audio id="bgm" src="./bgm.mp3" preload="auto" loop></audio>
    <script src="./app.js" defer></script>
  </body>
</html>
