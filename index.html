<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070611" />
    <meta name="description" content="一场藏在星空里的、逐句展开的捉迷藏。" />
    <title>♥</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <form id="keyGate" class="key-gate" aria-label="心之钥">
      <svg class="koishi-eye" viewBox="0 0 180 140" aria-hidden="true">
        <path class="eye-cord" d="M46 72 C19 37 12 103 35 108 C52 112 49 77 31 87 M134 72 C161 37 168 103 145 108 C128 112 131 77 149 87" />
        <path class="eye-body" d="M90 118 C67 102 47 85 47 63 C47 45 58 33 73 33 C81 33 87 37 90 44 C93 37 99 33 107 33 C122 33 133 45 133 63 C133 85 113 102 90 118 Z" />
        <path class="eye-lid" d="M63 72 Q90 89 117 72" />
      </svg>
      <input id="heartKey" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="心之钥" aria-label="输入心之钥" />
    </form>
    <canvas id="stars" aria-hidden="true"></canvas>
    <div class="nebula nebula-a" aria-hidden="true"></div>
    <div class="nebula nebula-b" aria-hidden="true"></div>
    <div id="whiteVeil" class="white-veil" aria-hidden="true"></div>

    <header class="topbar">
      <div class="review-control">
        <span id="reviewTaunt" class="review-taunt" role="status" aria-live="polite">你想逃跑对吗</span>
        <button id="reviewButton" class="review-button" type="button">回顾对话</button>
      </div>
    </header>

    <main id="stage" class="stage" tabindex="0" role="button" aria-label="点击显示下一句话">
      <section id="story" class="story" aria-live="polite" aria-atomic="true">
        <p id="previousLine" class="previous-line" aria-hidden="true"></p>
        <div class="line-wrap">
          <span class="quote-mark" aria-hidden="true">✦</span>
          <p id="storyLine" class="story-line"></p>
        </div>
        <p id="continueHint" class="continue-hint">点击屏幕</p>
      </section>
    </main>

    <div id="whisperLayer" class="whisper-layer" aria-hidden="true"></div>
    <input id="secretCode" class="secret-code" type="text" inputmode="numeric" maxlength="3" autocomplete="off" aria-label="输入三个数字" placeholder="···" disabled />

    <footer class="progress-area" aria-hidden="true">
      <div class="progress-track"><span id="progressFill"></span></div>
      <span id="progressLabel">00 / 00</span>
    </footer>

    <div id="reviewBackdrop" class="review-backdrop" hidden></div>
    <aside id="reviewPanel" class="review-panel" aria-hidden="true" aria-label="对话回顾">
      <header class="review-header">
        <div><small>MEMORIES</small><h2>回顾对话</h2></div>
        <button id="closeReview" type="button" aria-label="关闭对话回顾">×</button>
      </header>
      <div id="reviewList" class="review-list"></div>
    </aside>

    <audio id="bgm" src="./bgm.mp3" preload="auto" loop></audio>
    <script src="./app.js" defer></script>
  </body>
</html>
